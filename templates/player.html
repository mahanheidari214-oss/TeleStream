<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ file_name }} — پخش‌کننده کاویمو</title>
    <!-- Vazirmatn Font CDN for Persian Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07090e;
            --surface: rgba(15, 18, 28, 0.75);
            --surface-border: rgba(255, 255, 255, 0.1);
            --primary: #06b6d4;
            --primary-glow: rgba(6, 182, 212, 0.35);
            --primary-dark: #0891b2;
            --accent: #f59e0b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --font: 'Vazirmatn', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font);
            overflow: hidden;
        }

        .player-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            outline: none;
            background: #000;
        }

        /* Top Header Bar */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 16px 20px;
            background: linear-gradient(to bottom, rgba(7, 9, 14, 0.85) 0%, rgba(7, 9, 14, 0.4) 60%, transparent 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            transition: opacity 0.3s ease, transform 0.3s ease;
            direction: rtl;
        }

        .video-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 70%;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(6, 182, 212, 0.15);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .video-title {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .video-size {
            font-size: 12px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 8px;
            border-radius: 6px;
        }

        .top-actions {
            display: flex;
            gap: 8px;
        }

        .action-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            color: var(--text);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            backdrop-filter: blur(12px);
            transition: all 0.2s ease;
        }

        .action-chip:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--primary);
            color: #fff;
        }

        /* Center Ripple / Action Beacon */
        .center-beacon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(6, 182, 212, 0.85);
            box-shadow: 0 0 30px var(--primary-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            opacity: 0;
            pointer-events: none;
            z-index: 25;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
        }

        .center-beacon.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .center-beacon svg {
            width: 36px;
            height: 36px;
            fill: currentColor;
        }

        /* Mobile Double-Tap Ripple Overlay */
        .double-tap-zone {
            position: absolute;
            top: 0;
            bottom: 80px;
            width: 40%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        .zone-left { left: 0; }
        .zone-right { right: 0; }

        .tap-ripple {
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: rgba(6, 182, 212, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            opacity: 0;
            transform: scale(0.6);
            pointer-events: none;
            transition: all 0.4s ease;
        }

        .tap-ripple.active {
            opacity: 1;
            transform: scale(1.1);
        }

        /* Kavimo Dynamic Watermark */
        .kavimo-watermark {
            position: absolute;
            top: 20%;
            left: 10%;
            color: rgba(255, 255, 255, 0.18);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 5;
            animation: floatWatermark 35s infinite alternate ease-in-out;
            font-family: monospace;
        }

        @keyframes floatWatermark {
            0% { top: 18%; left: 8%; }
            50% { top: 65%; left: 75%; }
            100% { top: 40%; left: 20%; }
        }

        /* Floating Acrylic Bottom Control Dock */
        .controls-dock {
            position: absolute;
            bottom: 16px;
            left: 16px;
            right: 16px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 18px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 1px rgba(255, 255, 255, 0.2) inset;
            padding: 10px 16px 8px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 6px;
            direction: ltr; /* Keeps video player controls conventional left-to-right */
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .controls-dock.hidden, .top-bar.hidden {
            opacity: 0;
            transform: translateY(15px);
            pointer-events: none;
        }

        /* Scrubber / Progress Bar */
        .scrubber-container {
            position: relative;
            width: 100%;
            height: 14px;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .scrubber-track {
            position: relative;
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 4px;
            overflow: visible;
            transition: height 0.15s ease;
        }

        .scrubber-container:hover .scrubber-track {
            height: 7px;
        }

        .buffer-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 4px;
            pointer-events: none;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #06b6d4 0%, #38bdf8 100%);
            border-radius: 4px;
            box-shadow: 0 0 12px var(--primary-glow);
            pointer-events: none;
        }

        .scrubber-handle {
            position: absolute;
            top: 50%;
            left: 0%;
            transform: translate(-50%, -50%) scale(0);
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.8);
            pointer-events: none;
            transition: transform 0.15s ease;
        }

        .scrubber-container:hover .scrubber-handle, .scrubber-handle.active {
            transform: translate(-50%, -50%) scale(1);
        }

        .time-tooltip {
            position: absolute;
            bottom: 24px;
            left: 0%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--surface-border);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            color: #fff;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
            white-space: nowrap;
        }

        /* Controls Bottom Row */
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .controls-left, .controls-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-ctrl {
            background: none;
            border: none;
            color: #f1f5f9;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.2s ease;
        }

        .btn-ctrl:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--primary);
            transform: scale(1.05);
        }

        .btn-ctrl:active {
            transform: scale(0.95);
        }

        .btn-ctrl svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* Play button special pulse */
        .btn-play {
            background: rgba(6, 182, 212, 0.2);
            color: var(--primary);
            border: 1px solid rgba(6, 182, 212, 0.3);
        }

        .btn-play:hover {
            background: var(--primary);
            color: #000;
        }

        /* Volume slider */
        .volume-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 0px;
            height: 4px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.25);
            outline: none;
            opacity: 0;
            cursor: pointer;
            transition: width 0.25s ease, opacity 0.25s ease;
        }

        .volume-group:hover .volume-slider, .volume-slider:focus {
            width: 70px;
            opacity: 1;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            box-shadow: 0 0 6px var(--primary-glow);
        }

        /* Time Display */
        .time-display {
            font-size: 13px;
            font-weight: 500;
            color: #cbd5e1;
            margin-left: 6px;
            font-variant-numeric: tabular-nums;
            cursor: pointer;
        }

        .time-display .separator {
            margin: 0 4px;
            color: rgba(255, 255, 255, 0.3);
        }

        /* Biomaz Speed Stepper Button & Popup */
        .speed-group {
            position: relative;
        }

        .btn-speed {
            font-size: 13px;
            font-weight: 700;
            padding: 4px 10px;
            width: auto;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-speed:hover {
            background: rgba(6, 182, 212, 0.15);
            border-color: var(--primary);
        }

        .speed-menu {
            position: absolute;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            opacity: 0;
            pointer-events: none;
            backdrop-filter: blur(16px);
            z-index: 30;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .speed-menu.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) scale(1);
        }

        .speed-item {
            background: none;
            border: none;
            color: #e2e8f0;
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .speed-item:hover {
            background: rgba(6, 182, 212, 0.2);
            color: var(--primary);
        }

        .speed-item.active {
            background: var(--primary);
            color: #000;
            font-weight: 800;
        }

        /* Responsive Tweaks */
        @media (max-width: 600px) {
            .controls-dock {
                left: 8px;
                right: 8px;
                bottom: 10px;
                padding: 8px 12px;
            }
            .video-meta {
                max-width: 50%;
            }
            .volume-slider {
                display: none;
            }
            .action-chip span {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="player-container" id="playerContainer">
        <!-- Background Video Stream -->
        <video id="videoPlayer" playsinline preload="metadata" src="{{ stream_url }}"></video>

        <!-- Top Header Info -->
        <div class="top-bar" id="topBar">
            <div class="video-meta">
                <span class="brand-badge">کاویمو • BIOMAZ</span>
                <span class="video-title" title="{{ file_name }}">{{ file_name }}</span>
                <span class="video-size">{{ file_size }}</span>
            </div>
            <div class="top-actions">
                <a href="{{ vlc_url }}" class="action-chip" title="پخش در VLC / MX Player">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 22h20L12 2zm0 4.5l6.5 13.5h-13L12 6.5z"/></svg>
                    <span>VLC / MX</span>
                </a>
                <a href="{{ dl_url }}" class="action-chip" title="دانلود مستقیم با اینترنت منیجر">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                    <span>دانلود</span>
                </a>
            </div>
        </div>

        <!-- Center Action Beacon (Play/Pause Ripple) -->
        <div class="center-beacon" id="centerBeacon">
            <svg id="beaconIcon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </div>

        <!-- Mobile Double Tap Seek Zones -->
        <div class="double-tap-zone zone-left" id="zoneLeft">
            <div class="tap-ripple" id="rippleLeft">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
                <span>۱۰- ثانیه</span>
            </div>
        </div>
        <div class="double-tap-zone zone-right" id="zoneRight">
            <div class="tap-ripple" id="rippleRight">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
                <span>۱۰+ ثانیه</span>
            </div>
        </div>

        <!-- Floating Watermark (Kavimo Anti-Piracy Style) -->
        <div class="kavimo-watermark">TELESTREAM • KAVIMO EDITION</div>

        <!-- Floating Acrylic Control Dock -->
        <div class="controls-dock" id="controlsDock">
            <!-- Scrubber Timeline -->
            <div class="scrubber-container" id="scrubberContainer">
                <div class="scrubber-track" id="scrubberTrack">
                    <div class="buffer-bar" id="bufferBar"></div>
                    <div class="progress-bar" id="progressBar"></div>
                    <div class="scrubber-handle" id="scrubberHandle"></div>
                </div>
                <div class="time-tooltip" id="timeTooltip">00:00</div>
            </div>

            <!-- Controls Row -->
            <div class="controls-row">
                <!-- Left: Play, Jump -10s, +10s, Volume, Time -->
                <div class="controls-left">
                    <button class="btn-ctrl btn-play" id="btnPlay" title="پخش / توقف (Space)">
                        <svg id="playIcon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    </button>

                    <button class="btn-ctrl" id="btnRewind" title="۱۰ ثانیه به عقب (J / ←)">
                        <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.2 3.16-1.98 5.12-1.98 3.73 0 6.84 2.55 7.73 6h2.08c-.96-4.59-5.02-8-9.81-8z"/><text x="12" y="16" font-size="7" font-weight="900" fill="currentColor" text-anchor="middle" font-family="sans-serif">10</text></svg>
                    </button>

                    <button class="btn-ctrl" id="btnForward" title="۱۰ ثانیه به جلو (L / →)">
                        <svg viewBox="0 0 24 24"><path d="M11.5 8c2.65 0 5.05.99 6.9 2.6L22 7v9h-9l3.62-3.62c-1.39-1.2-3.16-1.98-5.12-1.98-3.73 0-6.84 2.55-7.73 6H1.69c.96-4.59 5.02-8 9.81-8z"/><text x="12" y="16" font-size="7" font-weight="900" fill="currentColor" text-anchor="middle" font-family="sans-serif">10</text></svg>
                    </button>

                    <div class="volume-group">
                        <button class="btn-ctrl" id="btnMute" title="صدا (M)">
                            <svg id="volumeIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                        </button>
                        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1">
                    </div>

                    <div class="time-display" id="timeDisplay" title="کلیک برای تغییر فرمت اعداد">
                        <span id="currentTime">00:00</span>
                        <span class="separator">/</span>
                        <span id="durationTime">00:00</span>
                    </div>
                </div>

                <!-- Right: Speed Stepper, PiP, Fullscreen -->
                <div class="controls-right">
                    <!-- Biomaz Speed Stepper -->
                    <div class="speed-group">
                        <button class="btn-ctrl btn-speed" id="btnSpeed">1x</button>
                        <div class="speed-menu" id="speedMenu">
                            <button class="speed-item" data-speed="0.5">0.5x</button>
                            <button class="speed-item" data-speed="0.75">0.75x</button>
                            <button class="speed-item active" data-speed="1">1x (عادی)</button>
                            <button class="speed-item" data-speed="1.25">1.25x</button>
                            <button class="speed-item" data-speed="1.5">1.5x</button>
                            <button class="speed-item" data-speed="1.75">1.75x</button>
                            <button class="speed-item" data-speed="2">2x</button>
                            <button class="speed-item" data-speed="2.5">2.5x</button>
                        </div>
                    </div>

                    <!-- Picture-in-Picture -->
                    <button class="btn-ctrl" id="btnPip" title="تصویر در تصویر (P)">
                        <svg viewBox="0 0 24 24"><path d="M19 11h-8v6h8v-6zm4 8V4.98C23 3.88 22.1 3 21 3H3c-1.1 0-2 .88-2 1.98V19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H3V4.97h18v14.05z"/></svg>
                    </button>

                    <!-- Fullscreen -->
                    <button class="btn-ctrl" id="btnFullscreen" title="تمام‌صفحه (F)">
                        <svg id="fullscreenIcon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const playerContainer = document.getElementById('playerContainer');
        const video = document.getElementById('videoPlayer');
        const topBar = document.getElementById('topBar');
        const controlsDock = document.getElementById('controlsDock');
        const btnPlay = document.getElementById('btnPlay');
        const playIcon = document.getElementById('playIcon');
        const btnRewind = document.getElementById('btnRewind');
        const btnForward = document.getElementById('btnForward');
        const btnMute = document.getElementById('btnMute');
        const volumeIcon = document.getElementById('volumeIcon');
        const volumeSlider = document.getElementById('volumeSlider');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');
        const timeDisplay = document.getElementById('timeDisplay');
        const scrubberContainer = document.getElementById('scrubberContainer');
        const progressBar = document.getElementById('progressBar');
        const bufferBar = document.getElementById('bufferBar');
        const scrubberHandle = document.getElementById('scrubberHandle');
        const timeTooltip = document.getElementById('timeTooltip');
        const btnSpeed = document.getElementById('btnSpeed');
        const speedMenu = document.getElementById('speedMenu');
        const speedItems = document.querySelectorAll('.speed-item');
        const btnPip = document.getElementById('btnPip');
        const btnFullscreen = document.getElementById('btnFullscreen');
        const fullscreenIcon = document.getElementById('fullscreenIcon');
        const centerBeacon = document.getElementById('centerBeacon');
        const beaconIcon = document.getElementById('beaconIcon');
        const zoneLeft = document.getElementById('zoneLeft');
        const zoneRight = document.getElementById('zoneRight');
        const rippleLeft = document.getElementById('rippleLeft');
        const rippleRight = document.getElementById('rippleRight');

        let isPersianDigits = false;
        let controlsTimeout = null;
        let isScrubbing = false;

        // Persian digit converter
        function toPersianDigits(str) {
            const persian = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
            return String(str).replace(/[0-9]/g, w => persian[+w]);
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) return "00:00";
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            const formatted = h > 0 
                ? `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`
                : `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            return isPersianDigits ? toPersianDigits(formatted) : formatted;
        }

        // Action Beacon Pulse
        function triggerBeacon(isPlay) {
            beaconIcon.innerHTML = isPlay 
                ? '<polygon points="5 3 19 12 5 21 5 3"/>'
                : '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
            centerBeacon.classList.add('show');
            setTimeout(() => centerBeacon.classList.remove('show'), 400);
        }

        // Toggle Play/Pause
        function togglePlay() {
            if (video.paused || video.ended) {
                video.play();
                triggerBeacon(true);
            } else {
                video.pause();
                triggerBeacon(false);
            }
        }

        btnPlay.addEventListener('click', togglePlay);

        video.addEventListener('play', () => {
            playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
            btnPlay.title = "توقف (Space)";
            resetHideControlsTimer();
        });

        video.addEventListener('pause', () => {
            playIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
            btnPlay.title = "پخش (Space)";
            showControls();
        });

        // Time updates & Scrubber Progress
        video.addEventListener('timeupdate', () => {
            if (!isScrubbing) {
                const percent = (video.currentTime / video.duration) * 100 || 0;
                progressBar.style.width = `${percent}%`;
                scrubberHandle.style.left = `${percent}%`;
                currentTimeEl.textContent = formatTime(video.currentTime);
            }
        });

        video.addEventListener('durationchange', () => {
            durationTimeEl.textContent = formatTime(video.duration);
        });

        video.addEventListener('progress', () => {
            if (video.buffered.length > 0 && video.duration) {
                const bufferedEnd = video.buffered.end(video.buffered.length - 1);
                const percent = (bufferedEnd / video.duration) * 100;
                bufferBar.style.width = `${percent}%`;
            }
        });

        // Toggle Persian Digits
        timeDisplay.addEventListener('click', () => {
            isPersianDigits = !isPersianDigits;
            currentTimeEl.textContent = formatTime(video.currentTime);
            durationTimeEl.textContent = formatTime(video.duration);
        });

        // Scrubber Seeking
        function seekFromEvent(e) {
            const rect = scrubberContainer.getBoundingClientRect();
            const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            progressBar.style.width = `${pos * 100}%`;
            scrubberHandle.style.left = `${pos * 100}%`;
            video.currentTime = pos * video.duration;
        }

        scrubberContainer.addEventListener('mousedown', (e) => {
            isScrubbing = true;
            scrubberHandle.classList.add('active');
            seekFromEvent(e);
        });

        window.addEventListener('mousemove', (e) => {
            if (isScrubbing) {
                seekFromEvent(e);
            }
            const rect = scrubberContainer.getBoundingClientRect();
            if (e.clientY >= rect.top - 20 && e.clientY <= rect.bottom + 20) {
                const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                timeTooltip.style.left = `${pos * 100}%`;
                timeTooltip.textContent = formatTime(pos * video.duration);
                timeTooltip.style.opacity = '1';
            } else {
                timeTooltip.style.opacity = '0';
            }
        });

        window.addEventListener('mouseup', () => {
            if (isScrubbing) {
                isScrubbing = false;
                scrubberHandle.classList.remove('active');
            }
            timeTooltip.style.opacity = '0';
        });

        // Skip Buttons
        btnRewind.addEventListener('click', () => { video.currentTime = Math.max(0, video.currentTime - 10); });
        btnForward.addEventListener('click', () => { video.currentTime = Math.min(video.duration || 0, video.currentTime + 10); });

        // Speed Selector
        btnSpeed.addEventListener('click', (e) => {
            e.stopPropagation();
            speedMenu.classList.toggle('show');
        });

        speedItems.forEach(item => {
            item.addEventListener('click', () => {
                const speed = parseFloat(item.dataset.speed);
                video.playbackRate = speed;
                btnSpeed.textContent = `${speed}x`;
                speedItems.forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                speedMenu.classList.remove('show');
            });
        });

        window.addEventListener('click', () => speedMenu.classList.remove('show'));

        // Volume & Mute
        btnMute.addEventListener('click', () => {
            video.muted = !video.muted;
            updateVolumeUI();
        });

        volumeSlider.addEventListener('input', (e) => {
            video.volume = e.target.value;
            video.muted = (video.volume === 0);
            updateVolumeUI();
        });

        function updateVolumeUI() {
            if (video.muted || video.volume === 0) {
                volumeIcon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
                volumeSlider.value = 0;
            } else {
                volumeIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
                volumeSlider.value = video.volume;
            }
        }

        // Fullscreen
        btnFullscreen.addEventListener('click', toggleFullscreen);

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                playerContainer.requestFullscreen().catch(err => alert(`Fullscreen error: ${err.message}`));
                fullscreenIcon.innerHTML = '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>';
            } else {
                document.exitFullscreen();
                fullscreenIcon.innerHTML = '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>';
            }
        }

        // Picture-in-Picture
        if (document.pictureInPictureEnabled) {
            btnPip.addEventListener('click', async () => {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else {
                    await video.requestPictureInPicture();
                }
            });
        } else {
            btnPip.style.display = 'none';
        }

        // Mobile Double-Tap Gestures
        let lastTapLeft = 0;
        let lastTapRight = 0;

        zoneLeft.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTapLeft < 300) {
                video.currentTime = Math.max(0, video.currentTime - 10);
                rippleLeft.classList.add('active');
                setTimeout(() => rippleLeft.classList.remove('active'), 500);
            }
            lastTapLeft = now;
        });

        zoneRight.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTapRight < 300) {
                video.currentTime = Math.min(video.duration || 0, video.currentTime + 10);
                rippleRight.classList.add('active');
                setTimeout(() => rippleRight.classList.remove('active'), 500);
            }
            lastTapRight = now;
        });

        // Auto-Hide Controls on Inactivity
        function showControls() {
            topBar.classList.remove('hidden');
            controlsDock.classList.remove('hidden');
            resetHideControlsTimer();
        }

        function hideControls() {
            if (!video.paused) {
                topBar.classList.add('hidden');
                controlsDock.classList.add('hidden');
                speedMenu.classList.remove('show');
            }
        }

        function resetHideControlsTimer() {
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(hideControls, 3500);
        }

        playerContainer.addEventListener('mousemove', showControls);
        playerContainer.addEventListener('touchstart', showControls);

        // Keyboard Shortcuts
        window.addEventListener('keydown', (e) => {
            showControls();
            switch(e.code) {
                case 'Space':
                case 'KeyK':
                    e.preventDefault();
                    togglePlay();
                    break;
                case 'ArrowLeft':
                case 'KeyJ':
                    e.preventDefault();
                    video.currentTime = Math.max(0, video.currentTime - 10);
                    break;
                case 'ArrowRight':
                case 'KeyL':
                    e.preventDefault();
                    video.currentTime = Math.min(video.duration || 0, video.currentTime + 10);
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    video.volume = Math.min(1, video.volume + 0.1);
                    video.muted = false;
                    updateVolumeUI();
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    video.volume = Math.max(0, video.volume - 0.1);
                    updateVolumeUI();
                    break;
                case 'KeyM':
                    video.muted = !video.muted;
                    updateVolumeUI();
                    break;
                case 'KeyF':
                    toggleFullscreen();
                    break;
                case 'KeyP':
                    if (document.pictureInPictureEnabled) btnPip.click();
                    break;
            }
        });
    </script>
</body>
</html>
